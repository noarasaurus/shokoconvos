  --bg:#f4f2fa; --card:#fff; --ink:#1c1c1e; --gray:#8e8e93; --hair:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12);
  --blue:#007aff; --red:#ff3b30; --green:#34c759;
  --spring:cubic-bezier(.2,.9,.3,1.15);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",'Heebo',system-ui,sans-serif;
  color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60% 40% at 8% 0%,rgba(255,45,85,.16),transparent 70%),
    radial-gradient(50% 36% at 100% 6%,rgba(255,179,64,.2),transparent 70%),
    radial-gradient(60% 40% at 0% 55%,rgba(175,82,222,.12),transparent 70%),
    radial-gradient(60% 40% at 100% 85%,rgba(48,176,199,.16),transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 18px calc(28px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}

/* nav */
.nav{position:relative;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.navbtn{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-size:1.06rem;font-weight:500;padding:6px 4px;border-radius:10px;transition:opacity .15s}
.navbtn:active{opacity:.4}
.navbtn svg{width:20px;height:20px}
.plusbtn{width:34px;height:34px;border-radius:50%;background:rgba(0,122,255,.12);color:var(--blue);display:grid;place-items:center;transition:transform .2s var(--spring)}
.plusbtn:active{transform:scale(.88)}
.plusbtn svg{width:18px;height:18px}

/* home */
.thead{display:flex;align-items:center;gap:10px;margin:6px 0 22px}
.ltitle{font-size:clamp(2.2rem,9vw,2.9rem);font-weight:800;letter-spacing:-.5px;line-height:1.05}
.sticker{width:50px;height:auto;flex:none;transform:rotate(8deg);animation:bob 3.6s ease-in-out infinite}

.hint{color:var(--gray);margin:-10px 0 22px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.mini{--c:#ff2d55;position:relative;cursor:pointer;border-radius:30px;padding:16px 14px 14px;color:#fff;text-align:start;overflow:hidden;background:var(--c);box-shadow:0 22px 30px -22px color-mix(in srgb,var(--c) 80%,transparent);animation:rise .5s var(--spring) var(--rd,0s) backwards,float var(--fd,5.5s) ease-in-out var(--fdl,.5s) infinite;transition:scale .25s var(--spring)}
.mini:active{scale:.96}
.mini small{display:block;font-size:.76rem;font-weight:500;opacity:.85}
.mini b{display:block;font-size:1.45rem;font-weight:800;line-height:1.1;margin-top:2px;word-break:break-word;letter-spacing:-.3px}
.mglass{margin:12px 0 10px;height:100px;border-radius:20px;background:rgba(255,255,255,.26);box-shadow:inset 0 2px 8px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.4);display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:1px;padding:6px;overflow:hidden;position:relative;direction:ltr}
.mglass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35) 0 16%,transparent 16% 26%,rgba(255,255,255,.14) 26% 31%,transparent 31%);pointer-events:none}
.mclaw{position:absolute;top:0;left:50%;width:28px;margin-left:-14px;transform-origin:50% 0;animation:swing var(--sd,3.8s) ease-in-out var(--sl,0s) infinite;z-index:1}
.mball{--bc:#ff6b8a;--i:0;position:relative;width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.9) 0 9%,transparent 12%),linear-gradient(180deg,var(--bc) 49%,rgba(0,0,0,.08) 49% 52%,#fff 52%);box-shadow:0 2px 3px rgba(0,0,0,.2)}

.mini:hover .mball,.mini:focus-visible .mball{animation:hop .7s var(--spring) calc(var(--i)*45ms) both}
.mstats{display:inline-block;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.24);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:3px 11px}
.floor.edit .mini{animation:jig .26s ease-in-out infinite alternate;cursor:default}
.floor.edit .mini:nth-child(even){animation-delay:-.13s}
.delbadge{position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;z-index:5;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.delbadge svg{width:16px;height:16px}

/* machine */
.machine{--c:#ff2d55;margin:8px auto 0;max-width:440px;border-radius:44px;padding:18px 16px 18px;color:#fff;background:var(--c);box-shadow:0 36px 46px -32px color-mix(in srgb,var(--c) 85%,transparent),0 10px 20px -14px rgba(0,0,0,.18);animation:rise .55s var(--spring)}
.sign{text-align:center;padding:2px 0 14px}
.sign small{display:block;font-size:.86rem;font-weight:500;opacity:.9}
.sign h1{font-size:2.15rem;font-weight:800;line-height:1.1;letter-spacing:-.5px;word-break:break-word}
.lights{display:flex;justify-content:center;gap:8px;margin-top:10px}
.lights i{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.8);animation:blink 1.6s infinite}
.lights i:nth-child(even){animation-delay:.8s}
.glass{direction:ltr;position:relative;height:330px;border-radius:30px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,#fff) 0%,color-mix(in srgb,var(--c) 26%,#fff) 100%);
  box-shadow:inset 0 6px 18px rgba(0,0,0,.2),0 0 0 3px rgba(255,255,255,.5)}
.glass::before{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(0,0,0,.1))}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(112deg,rgba(255,255,255,.5) 0 13%,transparent 13% 22%,rgba(255,255,255,.22) 22% 27%,transparent 27%)}
.rail{position:absolute;top:0;left:0;right:0;height:16px;z-index:3;background:linear-gradient(#f2f2f7,#d8d8de);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.claw{position:absolute;top:0;width:54px;margin-left:-27px;z-index:4;transition:left .6s cubic-bezier(.45,0,.2,1)}
.cable{width:4px;margin:16px auto 0;background:linear-gradient(90deg,#d1d1d6,#f2f2f7,#c7c7cc);border-radius:0 0 2px 2px;transition:height .6s cubic-bezier(.45,0,.2,1)}
.head{position:relative;width:54px;height:54px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.head svg{width:54px;height:54px;display:block;overflow:visible}
.pr{transition:transform .3s var(--spring);transform-origin:27px 14px}
.claw.open .pr.l{transform:rotate(24deg)}
.claw.open .pr.r{transform:rotate(-24deg)}
.held{position:absolute;left:50%;top:40px;transform:translateX(-50%);z-index:-1;transition:transform .4s cubic-bezier(.5,0,.9,.5)}
.chutezone{position:absolute;left:0;bottom:12px;width:66px;height:58px;z-index:1;border-radius:0 20px 0 0;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset -1px 1px 0 rgba(255,255,255,.7),inset 0 3px 10px rgba(0,0,0,.14)}


.ball{--bc:#ff6b8a;position:absolute;border-radius:50%;cursor:pointer;z-index:2;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.9) 0 9%,transparent 12%),linear-gradient(180deg,var(--bc) 49%,rgba(0,0,0,.08) 49% 52%,#fff 52%);box-shadow:inset 0 -5px 8px rgba(0,0,0,.1),0 5px 7px rgba(0,0,0,.2);transition:left .5s var(--spring),bottom .5s var(--spring),transform .2s var(--spring)}
.ball.wob{animation:wob .6s var(--spring)}
.glass{touch-action:pan-y}
.tip{position:absolute;z-index:7;pointer-events:none;max-width:190px;padding:6px 11px;border-radius:12px;background:rgba(30,24,48,.88);color:#fff;font-size:.82rem;font-weight:500;line-height:1.25;text-align:center;direction:rtl;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip.pinned{pointer-events:auto;max-width:240px;display:flex;align-items:center;gap:9px;padding:7px 7px 7px 12px;text-align:start}
.tip .tt{flex:1;min-width:0;word-break:break-word}
.tip .tgo{flex:none;background:#ff2d55;color:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:.8rem;transition:transform .2s var(--spring)}
.tip .tgo:active{transform:scale(.92)}
.todoadd{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px}
.todoadd input{flex:1;min-width:0;border:0;background:transparent;font-size:1.04rem;padding:8px 0;color:var(--ink)}
.todoadd input:focus{outline:none}
.tadd{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;transition:transform .2s var(--spring)}
.tadd svg{width:16px;height:16px}
.tadd:active{transform:scale(.88)}
.todoadd{border-bottom:.5px solid var(--hair)}
.row.dn .tx{color:var(--gray);text-decoration:line-through;text-decoration-color:rgba(60,60,67,.35)}
.row .tdate{font-size:.74rem;font-weight:600;color:var(--gray);flex:none}
.legend{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:7px}
.lchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);color:#fff;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 10px 3px 9px}
.lchip i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;display:block}
.legend.dark{margin:0 0 8px;justify-content:flex-start}
.legend.dark .lchip{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:0 1px 0 rgba(60,60,67,.06)}
.legend.dark .lchip i{border-color:#fff;box-shadow:0 0 0 1px rgba(60,60,67,.15)}
.tip .tby{display:block;font-size:.7rem;opacity:.7;margin-top:2px}
.shelfwrap{max-width:440px;margin:0 auto}
.sstat{font-size:.8rem;font-weight:600;color:var(--gray);margin:0 2px 8px}
.srow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;margin-bottom:18px;padding-top:4px}
.srow::before{content:"";position:absolute;left:-6px;right:-6px;top:56px;height:9px;border-radius:6px;background:linear-gradient(#fff,#e9e4f3);box-shadow:0 8px 12px -6px rgba(70,50,110,.3)}
.mug{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0;transition:transform .25s var(--spring)}
.mug svg{width:70px;height:65px;display:block}
.mug:active{transform:scale(.94)}
.mug .mt{margin-top:12px;font-weight:700;font-size:.82rem;line-height:1.2;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mug .md{margin-top:2px;font-size:.7rem;font-weight:600;color:var(--gray)}
.mug.pop{animation:pop .7s var(--spring)}
.xbtn{position:absolute;top:14px;left:14px;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--gray);display:grid;place-items:center;z-index:3}
.xbtn svg{width:14px;height:14px}
.xbtn:active{transform:scale(.9)}
.giftbub .xbtn{top:10px;left:10px}
.ptile{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#8a5a3c,#5a3320);display:grid;place-items:center;flex:none}
.ptile img{width:23px;height:auto;display:block}
img.sticker{display:block}
.ball:hover{transform:scale(1.08)}

.ball.drop{animation:dropin .95s cubic-bezier(.3,.1,.4,1)}
.mempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(60,60,67,.7);padding:20px 20px 40px;direction:rtl;z-index:1;font-weight:500}

.panel{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.slot{display:flex;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px;box-shadow:0 8px 16px -8px rgba(0,0,0,.25);min-width:0}
.slot input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);font:inherit;font-size:1.02rem;padding:8px 14px}
.slot input::placeholder{color:#aeaeb2}
.slot button{background:color-mix(in srgb,var(--c) 85%,#000);color:#fff;border-radius:999px;padding:6px 18px;font-weight:600;transition:transform .2s var(--spring)}
.slot button:active{transform:scale(.92)}
.bigbtn{width:100%;border-radius:22px;padding:16px 12px;font-size:1.25rem;font-weight:800;letter-spacing:-.2px;background:linear-gradient(#ffffff,#f0f0f5);color:color-mix(in srgb,var(--c) 78%,#000);
  box-shadow:0 7px 0 rgba(0,0,0,.14),0 18px 24px -10px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s}
.bigbtn:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.14),0 6px 10px -6px rgba(0,0,0,.3)}
.bigbtn[disabled]{opacity:.55;cursor:not-allowed}

/* sections */
h2.sec{font-size:1.5rem;font-weight:800;letter-spacing:-.3px;margin:38px 4px 12px;display:flex;align-items:baseline;gap:8px}
.cnt{font-size:1.05rem;font-weight:600;color:var(--gray)}
.group{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03),0 18px 30px -24px rgba(60,40,90,.5)}
.row{--bc:#ff6b8a;display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;animation:rise .35s var(--spring) backwards}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:54px;inset-inline-end:0;height:.5px;background:var(--hair)}
.row .tx{flex:1;cursor:pointer;font-size:1.04rem;word-break:break-word;padding:3px 0}
.pen{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#aeaeb2}
.pen svg{width:17px;height:17px}
.pen:active{background:var(--fill)}
.chk{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid #c7c7cc;display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,transform .3s var(--spring),color .2s}
.chk:active{transform:scale(.85)}
.chk.on{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.12)}
.chk svg{width:15px;height:15px}
.rowempty{padding:18px 16px;color:var(--gray);text-align:center}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.prize{--bc:#ff6b8a;cursor:pointer;position:relative;border-radius:26px;padding:14px 14px 13px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,color-mix(in srgb,var(--bc) 14%,#fff),color-mix(in srgb,var(--bc) 34%,#fff));
  box-shadow:0 16px 26px -20px color-mix(in srgb,var(--bc) 90%,#000),inset 0 1.5px 0 rgba(255,255,255,.8);transition:transform .3s var(--spring);animation:rise .4s var(--spring) backwards}
.prize:active{transform:scale(.96)}
.prize .pb{position:relative;width:34px;height:34px;border-radius:50%;margin-bottom:10px;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.9) 0 9%,transparent 12%),linear-gradient(180deg,var(--bc) 49%,rgba(0,0,0,.08) 49% 52%,#fff 52%);box-shadow:0 3px 5px rgba(0,0,0,.2)}

.prize .t{font-weight:700;line-height:1.25;word-break:break-word;font-size:1.02rem}
.prize .note{font-size:.8rem;margin-top:5px;color:rgba(60,60,67,.75);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prize .d{margin-top:10px;font-size:.76rem;font-weight:600;color:rgba(60,60,67,.65)}
.prize.pop{animation:pop .7s var(--spring)}
.none{grid-column:1/-1;background:rgba(255,255,255,.6);border-radius:22px;padding:22px;text-align:center;color:var(--gray)}

/* extras */
.steam path{animation:steam 2.8s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.9s}
.steam path:nth-child(3){animation-delay:1.8s}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}35%{opacity:.95}100%{opacity:0;transform:translateY(-6px)}}
.quiet{max-width:440px;margin:16px auto 0;display:flex;flex-direction:column;gap:10px;align-items:center}
.nextrow{display:inline-flex;align-items:center;gap:7px;color:var(--gray);font-size:.9rem;font-weight:500;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.55);transition:background .2s}
.nextrow:active{background:rgba(255,255,255,.9)}
.nextrow svg{width:16px;height:16px}
.navgrp{display:flex;align-items:center;gap:10px}
.sharebtn{width:34px;height:34px;border-radius:50%;background:rgba(0,122,255,.12);color:var(--blue);display:grid;place-items:center;position:relative;transition:transform .2s var(--spring)}
.sharebtn svg{width:18px;height:18px}
.linkbox{width:100%;direction:ltr;text-align:left;font-size:.82rem}
.moment{text-align:center;padding:2px 0 6px}
.bigcup img{width:92px;height:auto;display:block;margin:0 auto 6px}
.moment small{font-weight:600;color:var(--gray);display:block}
.moment .qtext{font-size:1.55rem;font-weight:800;line-height:1.25;letter-spacing:-.3px;margin:8px 0 18px;word-break:break-word}
.factcard{background:#fff6e0;border-radius:20px;padding:14px 16px;margin:6px 0 14px;text-align:start;animation:pop .6s var(--spring)}
.factcard b{display:block;font-size:.86rem;color:#a06a00;margin-bottom:4px}
.factcard p{font-size:1.02rem;line-height:1.45}
.bigrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 18px}
.bigrow .big{margin:0}
.bigrow .pen{flex:none}
.bigrow .pen.ok{color:var(--green)}
.bigin{flex:1;min-width:0;font:inherit;font-size:1.5rem;font-weight:800;text-align:center;color:var(--ink);background:var(--fill);border:0;border-radius:14px;padding:10px 12px;outline:none}
.swrow{display:flex;align-items:center;justify-content:space-between;margin:2px 6px 16px;font-weight:500}
.switch{width:51px;height:31px;border-radius:999px;background:#e5e5ea;position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:inset-inline-start .25s var(--spring)}
.switch[aria-pressed="true"]{background:var(--green)}
.switch[aria-pressed="true"]::after{inset-inline-start:22px}
a.btn{text-decoration:none;display:inline-block}
.field input[type=time]{text-align:center}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(30,20,50,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.show{display:flex;animation:fade .25s ease}
.sheet{background:#fff;width:100%;max-width:500px;border-radius:32px 32px 0 0;padding:26px 20px calc(28px + env(safe-area-inset-bottom));animation:up .45s var(--spring);max-height:92vh;overflow:auto;position:relative;box-shadow:0 -20px 50px -20px rgba(0,0,0,.3)}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:#d1d1d6}
@media (min-width:600px){.overlay{align-items:center;padding:20px}.sheet{border-radius:32px}}
.sheet h3{font-size:1.35rem;font-weight:800;letter-spacing:-.3px;margin-bottom:16px}
.sheet p.msg{color:var(--gray);margin:-6px 0 16px}
.field{display:block;margin-bottom:14px}
.field span.lb{display:block;font-size:.82rem;font-weight:500;color:var(--gray);margin:0 6px 5px}
.field input,.field textarea{width:100%;font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:14px;padding:12px 14px;outline:none;transition:box-shadow .2s}
.field input:focus,.field textarea:focus{box-shadow:0 0 0 2.5px rgba(0,122,255,.5)}
.field textarea{resize:none;height:66px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.actions .grow{flex:1}
.btn{border-radius:999px;padding:11px 22px;font-weight:600;transition:transform .2s var(--spring),opacity .2s}
.btn:active{transform:scale(.94)}
.btn.main{background:var(--blue);color:#fff}
.btn.soft{background:rgba(0,122,255,.12);color:var(--blue)}
.btn.pink{background:#ff2d55;color:#fff}
.btn.big{padding:13px 24px;font-size:1.05rem}
.bubbles{gap:10px;flex-wrap:nowrap}
.bubbles .grow1{flex:1}
.btn.red{background:var(--red);color:#fff}
.btn.danger{color:var(--red);padding-inline:10px}
.btn.danger.sure{background:var(--red);color:#fff;padding-inline:18px}
.dp{display:flex;gap:8px;direction:rtl}
.dpc{flex:1;min-width:0}
.dpc .lb{display:block;font-size:.74rem;color:var(--gray);margin:0 6px 4px}

@keyframes fade{from{opacity:0}to{opacity:1}}

.vl{width:2px;height:100%;background:#eadcc8;border-radius:1px;transition:background .5s}

:focus-visible{outline:3px solid rgba(0,122,255,.55);outline-offset:3px}

  function placeBalls(){
    if(!layout)return;
    var g=layout.glass,W=g.clientWidth,H=g.clientHeight,open=layout.open;
    layout.W=W;layout.H=H;layout.balls={};
    if(!open.length||!W)return;
    var CH=70,avail=W-CH-8,n=open.length,sizes=[56,50,44,38,33,29,25,22],s=sizes[sizes.length-1],step,cols=1;
    for(var k=0;k<sizes.length;k++){
      s=sizes[k];step=s*0.94;cols=Math.max(1,Math.floor((avail-step/2)/step));
      var rows=Math.ceil(n/cols);
      if(rows*s*0.8+s*0.3<=H-120)break;
    }
    step=s*0.94;
    open.forEach(function(t,i){
      var r=Math.floor(i/cols),c=i%cols,inRow=Math.min(cols,n-r*cols);
      var x0=CH+(avail-(inRow*step+step/2))/2+(r%2?step/2:0);
      var hs=hash(t.id);
      var x=x0+c*step+((hs%100)/100-.5)*step*.18;
      var y=14+r*s*0.8+(((hs>>3)%100)/100-.5)*s*.1;
      var b=makeBall(t,s,'ball'+(t.id===dropId?' drop':''));
      b.style.left=x+'px';b.style.bottom=y+'px';
      b.dataset.txt=t.text;b.dataset.id=t.id;b.setAttribute('role','button');b.setAttribute('aria-label',t.text);
      (function(tt){b.onclick=function(){if(busy)return;if(layout.pdPinned===tt.id)play(tt);else if(layout.pin)layout.pin(tt)}})(t);
      g.appendChild(b);
      layout.balls[t.id]={el:b,x:x,y:y,s:s};
    });
    dropId=null;
    var cl=layout.claw;cl.style.transition='none';cl.style.left=Math.round(CH+avail/2)+'px';void cl.offsetWidth;cl.style.transition='';
  }

  function setupHover(glass){
    var tip=el('div','tip');glass.appendChild(tip);var cur=null,hideT,pinned=null;
    function wob(b){b.classList.remove('wob');void b.offsetWidth;b.classList.add('wob');b.addEventListener('animationend',function(){b.classList.remove('wob')},{once:true})}
    function reset(){tip.style.transition='none';tip.classList.remove('pinned','on');void tip.offsetWidth;tip.style.transition=''}
    function place(info){
      var w=tip.offsetWidth,W=layout.W,cx=info.x+info.s/2;
      tip.style.left=Math.max(6,Math.min(W-w-6,cx-w/2))+'px';
      tip.style.bottom=(info.y+info.s+8)+'px';
    }
    function unpin(){pinned=null;layout.pinned=null;tip.classList.remove('on');cur=null}
    function pin(t){
      var info=layout&&layout.balls[t.id];if(!info||busy)return;
      pinned=t.id;layout.pinned=t.id;cur=info.el;wob(info.el);
      reset();
      tip.textContent='';var tt0=el('div','tt',t.text);var lo=lists.find(function(x){return x.id===t.listId}),bn=byName(lo,t);if(bn){tt0.appendChild(el('span','tby','נוספה על ידי '+bn))}tip.appendChild(tt0);
      var g=el('button','tgo','לתפוס');g.type='button';g.onclick=function(e){e.stopPropagation();var tt=t;unpin();layout.pdPinned=null;play(tt)};
      tip.appendChild(g);tip.classList.add('pinned');place(info);void tip.offsetWidth;tip.classList.add('on');
    }
    layout.pin=pin;
    function show(b){
      if(pinned)return;
      if(b===cur)return;cur=b;
      if(!b||busy){tip.classList.remove('on');return}
      wob(b);
      var info=layout&&layout.balls[b.dataset.id];if(!info)return;
      if(tip.classList.contains('pinned'))reset();
      tip.textContent=b.dataset.txt;place(info);tip.classList.add('on');
    }
    function at(e){var x=document.elementFromPoint(e.clientX,e.clientY);return x&&x.closest?x.closest('.ball'):null}
    glass.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;clearTimeout(hideT);show(at(e))});
    glass.addEventListener('pointerdown',function(e){
      clearTimeout(hideT);layout.pdPinned=pinned;
      if(e.target.closest&&e.target.closest('.tip'))return;

      if(b)wob(b);
      if(!b&&!pinned)show(null);
    });
    glass.addEventListener('pointerleave',function(e){if(!pinned&&e.pointerType!=='touch')show(null)});
    document.addEventListener('pointerdown',function f(e){if(!document.body.contains(glass)){document.removeEventListener('pointerdown',f);return}if(pinned&&!glass.contains(e.target))unpin()});
  }

  /* ---------- the claw ---------- */
  async function play(target){
    if(busy||!layout)return;
    var open=layout.open;if(!open.length){toast('המכונה ריקה');return}
    var t=target;
    if(!t){
      var pool=open.length>1?open.filter(function(x){return x.id!==lastPick}):open;
      t=pool[Math.floor(Math.random()*pool.length)];
    }
    lastPick=t.id;
    var info=layout.balls[t.id];
    if(reduced()||!info){openReveal(t);return}
    busy=true;
    var L=layout,claw=L.claw,cable=L.cable,H=L.H,W=L.W;
    var head=claw.querySelector('.head');
    var cx=info.x+info.s/2,topY=H-(info.y+info.s);
    var hGrab=Math.max(8,topY-56+6);
    var chuteX=36;
    try{
      claw.classList.add('open');
      claw.style.left=cx+'px';await sleep(650);
      cable.style.height=hGrab+'px';await sleep(650);
      claw.classList.remove('open');await sleep(320);
      var held=makeBall(t,info.s,'ball');
      held.style.position='relative';held.style.left='0';held.style.bottom='auto';held.style.cursor='default';held.style.transition='none';
      var hw=el('div','held');hw.appendChild(held);
      head.appendChild(hw);
      info.el.style.visibility='hidden';
      cable.style.height='10px';await sleep(650);
      claw.style.left=chuteX+'px';await sleep(750);
      var hDrop=Math.max(50,H-info.s-120);
      cable.style.height=hDrop+'px';await sleep(650);
      claw.classList.add('open');
      var fall=H-(16+hDrop+40)-info.s-14;
      hw.style.transform='translateX(-50%) translateY('+Math.max(0,fall)+'px)';
      await sleep(480);
      var landed=makeBall(t,info.s,'ball');
      landed.style.left=Math.max(2,chuteX-info.s/2)+'px';landed.style.bottom='14px';landed.style.transition='none';landed.style.cursor='default';
      L.glass.appendChild(landed);hw.remove();
      cable.style.height='14px';claw.style.left=Math.round(W/2+30)+'px';
      busy=false;L.dirty=true;
      openReveal(t);
    }catch(e){busy=false}
  }


  /* ---------- punch card + gift ---------- */
  var TWIG='<svg viewBox="0 0 40 22" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M0 14H40"/><path vector-effect="non-scaling-stroke" d="M12 14L18 5M25 14L30 7"/></svg>';
  function ensureGift(l,n){
    if(!l.gifts)l.gifts={};
    var k='g'+n;
    if(l.gifts[k]==null||!FACTS[l.gifts[k]]){l.gifts[k]=Math.floor(Math.random()*FACTS.length);persist('lists',l)}
    return FACTS[l.gifts[k]];
  }
  function punchCard(l){
    var pn=l.punches||0,base=pn===0?0:Math.floor((pn-1)/9)*9,filled=pn-base;
    var pc=el('div','pcard');
    var ph=el('div','ph');var pt=el('span','pt');pt.innerHTML='<span class="ptile">'+cupImg('',true)+'</span>';pt.appendChild(document.createTextNode('כרטיסיית שוקו'));ph.appendChild(pt);
    ph.appendChild(el('span','pcount',pn+' ניקובים'));pc.appendChild(ph);
    pc.appendChild(el('div','pnote','כל שיחה שדיברנו עליה מנקבת כוס שוקו. בכל כוס שלישית נפתחת הפתעה'));
    var tr=el('div','ptrack');
    for(var r=0;r<3;r++){
      var row=el('div','prow'+(r%2?' rev':''));
      for(var c=0;c<3;c++){
        var n=base+r*3+c+1,gift=c===2,on=n<=pn;
        var nd=el(gift&&on?'button':'div','pn'+(on?' on':'')+(gift?' gift':''));
        if(gift){nd.setAttribute('data-n',n);nd.innerHTML=GIFT}else nd.innerHTML=CUPG;
        if(gift&&on){nd.type='button';nd.setAttribute('aria-label','פתיחת ההפתעה');(function(nn){nd.onclick=function(){showGift(l,nn)}})(n)}
        row.appendChild(nd);
        if(c<2){var lk=el('span','lnk'+(n+1<=pn?' on':''));lk.innerHTML=TWIG;row.appendChild(lk)}
      }
      tr.appendChild(row);
      if(r<2){var v=el('div','vrow'+(r%2?' r':''));v.appendChild(el('span','vl'+(base+r*3+4<=pn?' on':'')));tr.appendChild(v)}
    }
    pc.appendChild(tr);
    var left=3-(pn%3);
    pc.appendChild(el('div','pfoot',pn>0&&pn%3===0?'ההפתעה מחכה, לחצי עליה':(left===1?'עוד שיחה אחת להפתעה':'עוד '+left+' שיחות להפתעה')));
    return pc;
  }
  function closeGift(){
    ['giftbub','giftback'].forEach(function(i){var e=$(i);if(e)e.remove()});
    document.querySelectorAll('.pn.burst').forEach(function(n){n.classList.remove('burst')});document.querySelectorAll('.pcard.flash').forEach(function(n){n.classList.remove('flash')});
  }
  var SPARK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L21 10l-5.2 3.9L17.4 21 12 17.2 6.6 21l1.6-7.1L3 10l6.8-1.7z" fill="currentColor"/></svg>';
  var CONF=['#cfae85','#6b3a24','#ff9fb5','#ffcc66','#f1dcc0','#ff8a5c','#b98cff'];
  function pourBox(){
    var w=el('div','pourbox');
    w.innerHTML='<svg viewBox="0 0 120 110" aria-hidden="true"><defs><clipPath id="cupclip"><path d="M30 42h50v30a20 20 0 0 1-20 20H50A20 20 0 0 1 30 72z"/></clipPath></defs>'
    +'<rect class="stream" x="52.5" y="-8" width="5" height="98" rx="2.5" fill="#6b3a24"/>'
    +'<g clip-path="url(#cupclip)"><rect class="cocoa" x="30" y="48" width="50" height="46" fill="#6b3a24"/><rect class="cocoa" x="30" y="48" width="50" height="5" fill="#8a5233"/></g>'
    +'<path d="M30 42h50v30a20 20 0 0 1-20 20H50A20 20 0 0 1 30 72z" fill="rgba(255,255,255,.35)" stroke="#cfae85" stroke-width="3.5" stroke-linejoin="round"/>'
    +'<path d="M80 50h5a9 9 0 0 1 0 18h-6" fill="none" stroke="#cfae85" stroke-width="3.5" stroke-linecap="round"/>'
    +'<g transform="rotate(-9 44 40)"><rect class="mm" style="--md:1.9s" x="35" y="33" width="17" height="14" rx="5.5" fill="#fff4e3" stroke="#e9cfae" stroke-width="1.2"/></g>'
    +'<g transform="rotate(7 63 41)"><rect class="mm" style="--md:2.1s" x="56" y="35" width="15" height="12" rx="5" fill="#ffd9e3" stroke="#f3b6c8" stroke-width="1.2"/></g>'
    +'<g class="pst" fill="none" stroke="#b99572" stroke-width="2.4" stroke-linecap="round"><path d="M44 28c-3-3 3-5 0-9"/><path d="M56 26c-3-3 3-5 0-10"/><path d="M68 28c-3-3 3-5 0-9"/></g></svg>';
    for(var i=0;i<18;i++){
      var c=el('span','cf'+(i%3===0?' c':''));
      var ang=(i/18)*Math.PI*2+Math.random()*.4,d=60+Math.random()*70;
      c.style.setProperty('--dx',Math.round(Math.cos(ang)*d)+'px');
      c.style.setProperty('--uy',Math.round(Math.sin(ang)*d*.6-40)+'px');
      c.style.setProperty('--dy',Math.round(Math.sin(ang)*d*.6+50+Math.random()*60)+'px');
      c.style.setProperty('--rot',Math.round(Math.random()*540-270)+'deg');
      c.style.setProperty('--cd',(2.0+Math.random()*.35)+'s');
      c.style.background=CONF[i%CONF.length];
      w.appendChild(c);
    }
    return w;
  }
  function showGift(l,n){
    closeGift();
    var node=document.querySelector('.pn.gift[data-n="'+n+'"]');
    var fact=ensureGift(l,n);
    var back=el('div','giftback');back.id='giftback';back.onclick=closeGift;document.body.appendChild(back);
    var bub=el('div','giftbub');bub.id='giftbub';
    var gx=el('button','xbtn');gx.type='button';gx.innerHTML=XICON;gx.setAttribute('aria-label','סגירה');gx.onclick=closeGift;bub.appendChild(gx);
    bub.appendChild(pourBox());
    bub.appendChild(el('b',null,'קיבלת הפתעה מכרטיסיית השוקו!'));
    bub.appendChild(el('small',null,'כל שלושה ניקובים פותחים הפתעה'));
    var dy=el('div','dy');
    var dk=el('span','dyk');dk.innerHTML=SPARK+'<em>הידעת?</em>'+SPARK;dy.appendChild(dk);
    var dp=el('p');var words=fact.split(' ');
    words.forEach(function(w,i){var sp=el('span','w',w);sp.style.animationDelay=(3.0+i*0.07)+'s';dp.appendChild(sp);if(i<words.length-1)dp.appendChild(document.createTextNode(' '))});
    dy.appendChild(dp);bub.appendChild(dy);
    var wait=3.0+words.length*0.07+1.0;
    var ok=el('button','btn pink late','להמשיך ללגום');ok.type='button';ok.disabled=true;ok.style.animationDelay=wait+'s';
    setTimeout(function(){ok.disabled=false},wait*1000);
    ok.onclick=closeGift;bub.appendChild(ok);
    var tail=el('i','tail');bub.appendChild(tail);document.body.appendChild(bub);
    var left=(window.innerWidth-bub.offsetWidth)/2,top=Math.max(12,(window.innerHeight-bub.offsetHeight)/2),ox='50%',oy='50%';
    var card=node&&node.closest('.pcard');if(card)card.classList.add('flash');
    if(node){
      node.scrollIntoView({block:'center'});
      var r=node.getBoundingClientRect(),bw=bub.offsetWidth,bh=bub.offsetHeight,cx=r.left+r.width/2;
      left=Math.max(12,Math.min(window.innerWidth-bw-12,cx-bw/2));
      top=r.top-bh-18;var below=false;
      if(top<12){top=r.bottom+18;below=true;bub.classList.add('below')}
      var tx=Math.max(20,Math.min(bw-20,cx-left));
      tail.style.left=tx+'px';ox=tx+'px';oy=below?'0':'100%';
      node.classList.add('burst');
    }
    bub.style.left=left+'px';bub.style.top=top+'px';bub.style.transformOrigin=ox+' '+oy;
  }
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeGift()});

  /* ---------- main render ---------- */
  function render(){
    if(!ready||busy)return;
    var l=routeId&&lists.find(function(x){return x.id===routeId});
    if(routeId&&!l&&got.lists){routeId=null}
    var key=l?l.id:'home',y=window.scrollY;
    if(l)renderList(l);else renderHome();
    if(key===lastKey&&y>0)window.scrollTo(0,y);
    lastKey=key;
  }
  var lastKey=null;
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(layout&&!busy&&routeId){var g=layout.glass;g.querySelectorAll('.ball').forEach(function(b){b.remove()});placeBalls()}},200)});

  function start(){ready=true;render()}
  function goLocal(){var o=loadLocal();lists=o.lists;topics=o.topics;todos=o.todos;mode='local';start()}

  function init(){
    readRoute();
    var o=loadLocal();lists=o.lists;topics=o.topics;todos=o.todos;mode='local';got.lists=true;start();
    startPolling();pull(true);
    var j=(location.search.match(/[?&]join=([a-z0-9]+)/)||[])[1];
    if(j&&SYNC_URL)setTimeout(function(){openJoin(j)},350);
  }
  init();
})();
</script>
